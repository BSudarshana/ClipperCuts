<div class="report-card">
  <h2>Appointments by Status</h2>

  <div *ngIf="loading" class="loading">Loading report...</div>

  <table *ngIf="!loading" class="report-table">
    <thead>
      <tr>
          <th>Status</th>
          <th>Count</th>
          <th>Percentage (%)</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of data">
          <td>{{ row.status }}</td>
          <td>{{ row.count }}</td>
          <td>{{ row.percentage }}</td>
      </tr>
      <tr *ngIf="data.length === 0">
        <td colspan="3" class="empty">No data available</td>
      </tr>
    </tbody>
  </table>
</div>
